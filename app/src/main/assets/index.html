<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Köprü</title>
<style>
  :root { --ground:#0D0E10; --surface:#151619; --raised:#1B1D21; --chip:#23262B; --line:#26292E; --line2:#33373D;
          --ink:#EDEEF0; --muted:#8A8F98; --accent:#4C8DFF; --good:#3FB97A; --blue:#4C8DFF; --bad:#E5534B; }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin:0; background:var(--ground); color:var(--ink); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  .top { position:sticky; top:0; z-index:5; background:rgba(13,14,16,.86); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
  .top .in-wrap { max-width:1120px; margin:0 auto; padding:0 24px; height:56px; display:flex; align-items:center; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; letter-spacing:-.1px; }
  .brand svg { color:var(--accent); }
  .top .grow { flex:1; }
  .pill { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .pill i { width:7px; height:7px; border-radius:50%; background:var(--good); box-shadow:0 0 0 3px rgba(63,185,122,.15); }
  .pill.off i { background:var(--bad); box-shadow:0 0 0 3px rgba(229,83,75,.15); }

  main { max-width:1120px; margin:0 auto; padding:28px 24px 64px; display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:28px; align-items:start; }
  @media (max-width:900px) { main { grid-template-columns: minmax(0,1fr); } }
  h2 { margin:0; font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .left, .right { display:flex; flex-direction:column; gap:16px; min-width:0; }

  .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border:1px solid var(--line); border-radius:10px; background:var(--surface); }
  .stat { padding:14px 16px; border-left:1px solid var(--line); }
  .stat:first-child { border-left:0; }
  .stat small { color:var(--muted); font-size:12px; display:block; }
  .stat b { font-size:20px; font-weight:600; display:block; margin-top:2px; font-variant-numeric: tabular-nums; color:var(--ink) !important; }
  .stat span { color:var(--muted); font-size:12px; }
  @media (max-width:640px) { .stats { grid-template-columns:repeat(2, minmax(0,1fr)); } .stat:nth-child(3) { border-left:0; } .stat:nth-child(n+3) { border-top:1px solid var(--line); } }

  #drop { border:1px dashed var(--line2); border-radius:10px; padding:28px 24px; display:flex; align-items:center; gap:16px; background:var(--surface); cursor:pointer; transition: border-color .15s, background .15s; }
  #drop:hover { border-color:#45494F; }
  #drop.over { border-color:var(--accent); background:rgba(76,141,255,.06); }
  #drop .txt { flex:1; display:flex; flex-direction:column; gap:2px; }
  #drop .big { font-size:15px; font-weight:600; }
  #drop .small { font-size:13px; color:var(--muted); }
  #drop .ic { width:40px; height:40px; border-radius:8px; background:var(--chip); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none; }

  .btn { height:34px; padding:0 14px; border-radius:7px; background:var(--accent); color:#fff; font-weight:500; display:inline-flex; align-items:center; gap:8px; border:1px solid transparent; font-size:13px; text-decoration:none; white-space:nowrap; transition: background .12s, border-color .12s, color .12s; }
  .btn:hover { background:#3D7EF0; }
  .btn.ghost { background:transparent; color:var(--ink); border-color:var(--line2); }
  .btn.ghost:hover { background:var(--raised); }
  .btn.small { height:28px; padding:0 10px; font-size:12.5px; }
  .btn.danger { color:var(--bad); }
  .btn.danger:hover { background:rgba(229,83,75,.1); border-color:rgba(229,83,75,.4); }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tabs { display:flex; gap:2px; border:1px solid var(--line); padding:2px; border-radius:8px; background:var(--surface); }
  .tabs button { border:0; background:transparent; color:var(--muted); padding:5px 12px; border-radius:6px; font-size:13px; }
  .tabs button.on { background:var(--chip); color:var(--ink); }
  .tabs button em { font-style:normal; color:var(--muted); font-size:12px; margin-left:6px; font-variant-numeric: tabular-nums; }
  .search { flex:1 1 180px; height:34px; border-radius:7px; border:1px solid var(--line); background:var(--surface); padding:0 12px; outline:none; }
  .search:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(76,141,255,.15); }

  .list { display:flex; flex-direction:column; }
  #files { border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden; }
  #files:has(> .empty) { border-style:dashed; }
  .day { color:var(--muted); font-size:12px; font-weight:600; padding:10px 16px 6px; background:var(--ground); border-bottom:1px solid var(--line); }
  #files .day:not(:first-child) { border-top:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #files .row:last-child { border-bottom:0; }
  #files .row:hover { background:var(--raised); }
  .ico { width:36px; height:36px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:700; letter-spacing:.03em; flex:none; overflow:hidden; background-size:cover; background-position:center; }
  .info { flex:1 1 200px; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .name { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { font-size:12.5px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; }
  .meta > span + span::before { content:"·"; margin-right:6px; color:#555A62; }
  .in, .out { color:var(--muted); }
  .actions { display:flex; gap:6px; opacity:.85; }
  .row:hover .actions { opacity:1; }
  .empty { color:var(--muted); font-size:13.5px; padding:28px 16px; margin:0; text-align:center; }

  #xfers:empty { display:none; }
  #xfers { gap:8px; }
  .xfer { border:1px solid var(--line); border-radius:10px; background:var(--surface); }
  .bar { position:relative; height:4px; border-radius:2px; background:var(--chip); flex-basis:100%; overflow:hidden; }
  .bar > i { position:absolute; inset:0 auto 0 0; width:0; border-radius:2px; background:var(--accent); transition:width .25s ease; }
  .bar.done > i { background:var(--good); }
  .pct { font-weight:600; font-variant-numeric: tabular-nums; font-size:13px; color:var(--muted); }

  .card { border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:14px; display:flex; flex-direction:column; gap:10px; }
  .note { border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .note pre { margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; font-size:13.5px; max-height:180px; overflow:auto; }
  .note .foot { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .note .foot span { flex:1; }
  textarea { width:100%; min-height:88px; resize:vertical; border-radius:7px; background:var(--ground); border:1px solid var(--line); padding:10px 12px; outline:none; }

  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(12px); background:var(--raised); border:1px solid var(--line2); padding:9px 14px; border-radius:8px; font-size:13px; opacity:0; transition:.18s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  #toast.show { opacity:1; transform:translateX(-50%); }
  dialog { background:var(--surface); color:var(--ink); border:1px solid var(--line2); border-radius:12px; padding:20px; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,.5); }
  dialog h2 { text-transform:none; letter-spacing:0; font-size:15px; color:var(--ink); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog p { color:var(--muted); margin:8px 0 18px; }
  dialog .actions { justify-content:flex-end; flex-wrap:wrap; opacity:1; }
</style>
</head>
<body>
<div class="top"><div class="in-wrap">
  <span class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 17c3-6 15-6 18 0"/><path d="M7 13v4M12 11v6M17 13v4"/></svg>Köprü</span>
  <span class="grow"></span>
  <span id="status" class="pill"><i></i><span>Bağlanıyor…</span></span>
</div></div>
<main>
  <div class="left">
    <section class="stats" aria-label="Özet">
      <div class="stat"><small>Telefona giden</small><b id="sIn">0</b><span id="sInB">0 B</span></div>
      <div class="stat"><small>Telefondan gelen</small><b id="sOut">0</b><span id="sOutB">0 B</span></div>
      <div class="stat"><small>Notlar</small><b id="sNotes">0</b><span>pano</span></div>
      <div class="stat"><small>Bu oturumda</small><b id="sSess">0 B</b><span>aktarıldı</span></div>
    </section>

    <label id="drop" for="pick">
      <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span>
      <span class="txt"><span class="big">Dosyaları buraya bırak</span>
        <span class="small">ya da tıkla · Ctrl+V ile yapıştır · telefonda İndirilenler/Köprü klasörüne gider</span></span>
      <input id="pick" type="file" multiple hidden>
      <span class="btn">Dosya seç</span>
    </label>

    <div class="list" id="xfers" aria-live="polite"></div>

    <div class="toolbar">
      <div class="tabs" role="tablist" id="tabs"></div>
      <input class="search" id="q" type="search" placeholder="Dosya ara" aria-label="Dosya ara">
      <button class="btn ghost" id="dlAll" title="Görünen tüm dosyaları indir">Tümünü indir</button>
    </div>
    <div class="list" id="files"><p class="empty">Yükleniyor…</p></div>
  </div>

  <aside class="right">
    <h2>Notlar</h2>
    <div class="card">
      <textarea id="noteText" placeholder="Metin, link, şifre… (Ctrl+Enter gönderir)"></textarea>
      <div class="toolbar">
        <button class="btn" id="noteSend">Gönder</button>
        <button class="btn ghost" id="notePaste">Panodan yapıştır</button>
      </div>
    </div>
    <div class="list" id="notes"></div>
  </aside>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="actions" id="dlgActions"></div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (b) => b < 0 ? '?' : b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(0) + ' KB'
  : b < 1073741824 ? (b/1048576).toFixed(1).replace('.', ',') + ' MB' : (b/1073741824).toFixed(2).replace('.', ',') + ' GB';
const eta = (s) => !isFinite(s) || s < 0 ? 'hesaplanıyor' : s < 60 ? Math.ceil(s) + ' sn kaldı'
  : s < 3600 ? Math.floor(s/60) + ' dk ' + Math.floor(s%60) + ' sn kaldı' : Math.floor(s/3600) + ' sa ' + Math.floor(s%3600/60) + ' dk kaldı';
const clock = (t) => new Date(t).toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
function day(t) {
  const d = new Date(t), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, now)) return 'Bugün';
  if (same(d, y)) return 'Dün';
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric', weekday:'long' });
}
const KINDS = [
  [/^(jpe?g|png|gif|webp|heic|bmp|svg)$/, 'RESİM', '#B48CF2'], [/^(mp4|mkv|mov|avi|webm|3gp)$/, 'VİDEO', '#E8875B'],
  [/^(mp3|wav|flac|m4a|ogg|aac)$/, 'SES', '#4FB3D9'], [/^pdf$/, 'PDF', '#E5534B'], [/^(zip|rar|7z|tar|gz)$/, 'ARŞİV', '#D4A64A'],
  [/^apk$/, 'APK', '#3FB97A'], [/^(docx?|txt|md|odt|rtf)$/, 'BELGE', '#4C8DFF'], [/^(xlsx?|csv)$/, 'TABLO', '#3FB97A'],
];
function kind(name) {
  const e = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
  for (const [re, label, color] of KINDS) if (re.test(e)) return { label, color, img: label === 'RESİM' };
  return { label: (e || 'dosya').slice(0, 5).toUpperCase(), color: '#8A8F98', img: false };
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); }
function ask(title, text, buttons) {
  return new Promise((done) => {
    const d = $('#dlg'); $('#dlgTitle').textContent = title; $('#dlgText').textContent = text;
    const box = $('#dlgActions'); box.innerHTML = '';
    for (const [label, value, cls] of buttons) {
      const b = document.createElement('button'); b.className = 'btn small ' + (cls || 'ghost'); b.textContent = label;
      b.onclick = () => { d.close(); done(value); }; box.append(b);
    }
    d.onclose = () => done(null); d.showModal();
  });
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Kopyalandı');
}

let state = { items: [], notes: [], transfers: [] }, tab = 'all', sessionBytes = 0;
const TABS = [['all', 'Tümü'], ['in', 'Telefona giden'], ['out', 'Telefondan']];

function renderTabs() {
  const n = { all: state.items.length, in: state.items.filter((f) => f.in).length, out: state.items.filter((f) => !f.in).length };
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" class="${k === tab ? 'on' : ''}" data-tab="${k}">${l}<em>${n[k]}</em></button>`).join('');
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; render(); } });
$('#q').addEventListener('input', render);

function visible() {
  const q = $('#q').value.trim().toLowerCase();
  return state.items.filter((f) => (tab === 'all' || (tab === 'in') === f.in) && (!q || f.name.toLowerCase().includes(q)));
}

function render() {
  renderTabs();
  const ins = state.items.filter((f) => f.in), outs = state.items.filter((f) => !f.in);
  const sum = (a) => a.reduce((s, f) => s + Math.max(0, f.size), 0);
  $('#sIn').textContent = ins.length; $('#sInB').textContent = fmt(sum(ins));
  $('#sOut').textContent = outs.length; $('#sOutB').textContent = fmt(sum(outs));
  $('#sNotes').textContent = state.notes.length; $('#sSess').textContent = fmt(sessionBytes);

  const list = visible();
  let html = '', lastDay = '';
  for (const f of list) {
    const d = day(f.t);
    if (d !== lastDay) { html += `<div class="day">${esc(d)}</div>`; lastDay = d; }
    const k = kind(f.name);
    const thumb = k.img && f.size < 15e6 ? `style="background-image:url('/dl/${encodeURIComponent(f.id)}?inline=1');background-color:${k.color}22"` : `style="background:${k.color}22;color:${k.color}"`;
    html += `<div class="row">
      <span class="ico" ${thumb}>${k.img && f.size < 15e6 ? '' : esc(k.label)}</span>
      <div class="info"><span class="name" title="${esc(f.name)}">${esc(f.name)}</span>
        <span class="meta"><span class="${f.in ? 'in' : 'out'}">${f.in ? 'Telefona gönderildi' : 'Telefondan'}</span>
          <span>${clock(f.t)}</span><span>${fmt(f.size)}</span>${f.dl ? `<span>${f.dl}× indirildi</span>` : ''}</span></div>
      <div class="actions">
        ${k.img || /^(VİDEO|SES|PDF)$/.test(k.label) ? `<a class="btn ghost small" href="/dl/${encodeURIComponent(f.id)}?inline=1" target="_blank" rel="noopener">Önizle</a>` : ''}
        <a class="btn ghost small" href="/dl/${encodeURIComponent(f.id)}" download>İndir</a>
        <button class="btn ghost small danger" data-del="${esc(f.id)}" aria-label="${esc(f.name)} sil">Sil</button>
      </div></div>`;
  }
  $('#files').innerHTML = html || `<p class="empty">${$('#q').value ? 'Eşleşen dosya yok.' : 'Henüz dosya yok. Telefonda “Dosya gönder”e dokun ya da buraya dosya bırak.'}</p>`;

  $('#notes').innerHTML = state.notes.map((n) => `<div class="note">
      <pre>${esc(n.text)}</pre>
      <div class="foot"><span class="${n.pc ? 'in' : 'out'}">${n.pc ? 'Bilgisayardan' : 'Telefondan'} · ${esc(day(n.t))} ${clock(n.t)}</span>
        <button class="btn ghost small" data-copy="${esc(n.id)}">Kopyala</button>
        <button class="btn ghost small danger" data-ndel="${esc(n.id)}" aria-label="Notu sil">Sil</button></div></div>`).join('')
    || '<p class="empty">Not yok. Telefona hızlıca metin/link atmak için yukarıya yaz.</p>';

  renderPhoneTransfers();
}

// Telefon tarafındaki aktarımlar (bilgisayarın indirdikleri) — telefondan gelen veriyle.
function renderPhoneTransfers() {
  const box = $('#xfers');
  box.querySelectorAll('.phone').forEach((e) => e.remove());
  for (const t of state.transfers.filter((t) => !t.in)) {
    const p = t.total > 0 ? t.done / t.total : 0;
    const el = document.createElement('div');
    el.className = 'row xfer phone'; el.style.setProperty('--c', 'var(--blue)');
    el.innerHTML = `<div class="info"><span class="name">${esc(t.name)}</span>
      <span class="meta"><span class="out">↓ telefondan indiriliyor</span><span>${fmt(t.done)} / ${fmt(t.total)}</span><span>${fmt(t.speed)}/sn</span><span>${eta((t.total - t.done) / t.speed)}</span></span></div>
      <span class="pct">%${Math.floor(p * 100)}</span><div class="bar"><i style="width:${(p*100).toFixed(1)}%"></i></div>`;
    box.append(el);
  }
}

document.addEventListener('click', async (e) => {
  const del = e.target.closest('[data-del]'), cp = e.target.closest('[data-copy]'), nd = e.target.closest('[data-ndel]');
  if (del) {
    const f = state.items.find((x) => x.id === del.dataset.del); if (!f) return;
    const choice = await ask('“' + f.name + '” silinsin mi?',
      f.in ? 'Yalnızca listeden kaldırabilir ya da telefondaki dosyayı da silebilirsin.' : 'Telefondaki asıl dosyaya dokunulmaz, yalnızca paylaşım listesinden kalkar.',
      f.in ? [['Vazgeç', null], ['Listeden kaldır', '0'], ['Telefondan da sil', '1', 'danger']] : [['Vazgeç', null], ['Listeden kaldır', '0', '']]);
    if (choice == null) return;
    await fetch('/api/item/' + encodeURIComponent(f.id) + (choice === '1' ? '?disk=1' : ''), { method: 'DELETE' });
    toast(choice === '1' ? 'Telefondan silindi' : 'Listeden kaldırıldı'); refresh();
  }
  if (cp) { const n = state.notes.find((x) => x.id === cp.dataset.copy); if (n) copy(n.text); }
  if (nd) { await fetch('/api/note/' + encodeURIComponent(nd.dataset.ndel), { method: 'DELETE' }); refresh(); }
});

$('#dlAll').addEventListener('click', async () => {
  const list = visible(); if (!list.length) return toast('İndirilecek dosya yok');
  toast(list.length + ' dosya indiriliyor');
  for (const f of list) {
    const a = document.createElement('a'); a.href = '/dl/' + encodeURIComponent(f.id); a.download = f.name; document.body.append(a); a.click(); a.remove();
    await new Promise((r) => setTimeout(r, 700));
  }
});

async function sendNote() {
  const text = $('#noteText').value; if (!text.trim()) return;
  const r = await fetch('/api/note', { method: 'POST', body: new Blob([text], { type: 'text/plain' }) });
  if (r.ok) { $('#noteText').value = ''; toast('Telefona gönderildi'); refresh(); } else toast('Gönderilemedi');
}
$('#noteSend').addEventListener('click', sendNote);
$('#noteText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.ctrlKey) sendNote(); });
$('#notePaste').addEventListener('click', async () => {
  try { $('#noteText').value = await navigator.clipboard.readText(); $('#noteText').focus(); }
  catch { toast('Pano okunamadı — Ctrl+V ile yapıştır'); $('#noteText').focus(); }
});

let lastKey = '';
async function refresh() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const s = await r.json();
    $('#status').className = 'pill'; $('#status span').textContent = (s.device || 'Telefon') + ' bağlı';
    const key = JSON.stringify(s);
    if (key === lastKey) return;
    lastKey = key; state = s; render();
  } catch {
    $('#status').className = 'pill off'; $('#status span').textContent = 'Telefona ulaşılamıyor';
  }
}

// Yüklemeler sırayla gider; her biri iptal edilebilir.
let queue = Promise.resolve();
function upload(files) {
  for (const file of files) {
    const row = document.createElement('div');
    row.className = 'row xfer'; row.style.setProperty('--c', 'var(--accent)');
    row.innerHTML = `<div class="info"><span class="name">${esc(file.name)}</span><span class="meta"><span>Sırada · ${fmt(file.size)}</span></span></div>
      <span class="pct">%0</span><button class="btn ghost small danger">İptal</button><div class="bar"><i></i></div>`;
    $('#xfers').prepend(row);
    const meta = row.querySelector('.meta'), bar = row.querySelector('.bar > i'), pct = row.querySelector('.pct'), cancel = row.querySelector('button');
    let xhr = null, cancelled = false;
    const finish = (msg, cls, ok) => {
      meta.innerHTML = `<span class="${cls}">${msg}</span><span>${fmt(file.size)}</span><span>${clock(Date.now())}</span>`;
      row.querySelector('.bar').classList.add('done'); cancel.remove();
      if (ok) { bar.style.width = '100%'; pct.textContent = '✓'; row.style.setProperty('--c', 'var(--good)'); }
      setTimeout(() => { row.style.transition = 'opacity .4s'; row.style.opacity = '0'; setTimeout(() => row.remove(), 400); }, ok ? 4000 : 8000);
    };
    cancel.onclick = () => { cancelled = true; if (xhr) xhr.abort(); else finish('İptal edildi', '', false); };
    queue = queue.then(() => cancelled ? null : new Promise((done) => {
      const start = performance.now();
      xhr = new XMLHttpRequest();
      xhr.open('PUT', '/up?name=' + encodeURIComponent(file.name));
      let prev = 0;
      xhr.upload.onprogress = (e) => {
        const p = e.lengthComputable ? e.loaded / e.total : 0;
        sessionBytes += e.loaded - prev; prev = e.loaded;
        const speed = e.loaded / Math.max(0.2, (performance.now() - start) / 1000);
        bar.style.width = (p * 100).toFixed(1) + '%'; pct.textContent = '%' + Math.floor(p * 100);
        meta.innerHTML = `<span class="in">↑ telefona gidiyor</span><span>${fmt(e.loaded)} / ${fmt(file.size)}</span><span>${fmt(speed)}/sn</span><span>${eta((file.size - e.loaded) / speed)}</span>`;
      };
      xhr.onload = () => { const ok = xhr.status === 200; finish(ok ? '✓ Telefona ulaştı' : 'Hata: ' + xhr.status, ok ? 'in' : '', ok); refresh(); done(); };
      xhr.onerror = () => { finish('Bağlantı hatası', '', false); done(); };
      xhr.onabort = () => { finish('İptal edildi', '', false); done(); };
      xhr.send(file);
    }));
  }
}

$('#pick').addEventListener('change', (e) => { upload([...e.target.files]); e.target.value = ''; });
const drop = $('#drop');
['dragenter', 'dragover'].forEach((t) => window.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => window.addEventListener(t, (e) => { e.preventDefault(); if (t === 'drop' || !e.relatedTarget) drop.classList.remove('over'); }));
window.addEventListener('drop', (e) => { if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });
// Ctrl+V: panodaki dosya/ekran görüntüsü telefona gider (not kutusunda değilken).
window.addEventListener('paste', (e) => {
  if (e.target === $('#noteText') || e.target === $('#q')) return;
  const files = [...e.clipboardData.files];
  if (files.length) { e.preventDefault(); upload(files.map((f, i) => f.name === 'image.png' ? new File([f], `ekran_${Date.now()}_${i}.png`, { type: f.type }) : f)); }
  else { const t = e.clipboardData.getData('text'); if (t) { $('#noteText').value = t; toast('Metin not kutusuna alındı'); } }
});

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
